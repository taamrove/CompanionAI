<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CompanionAI · The Archive</title>
<style>
  :root { --accent: #5fd0ff; --warm: #ffcf6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: #04060d; color: #cfe6ff;
    font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  #scene { position: fixed; inset: 0; }

  .hud { position: fixed; pointer-events: none; z-index: 10; }
  #title { top: 18px; left: 22px; }
  #title b { font-size: 17px; letter-spacing: 3px; color: #fff; }
  #title .sub { letter-spacing: 2px; opacity: .55; font-size: 11px; }
  #stat { top: 18px; right: 22px; text-align: right; opacity: .7; font-size: 12px; }
  .pill { display:inline-block; padding:1px 8px; border:1px solid #5fd0ff44;
          border-radius: 20px; margin-left:6px; }

  /* selected record panel */
  #record { top: 50%; right: 22px; transform: translateY(-50%);
    width: 320px; max-height: 64vh; overflow:auto; padding: 16px 18px;
    background: #0a1322dd; border: 1px solid #5fd0ff33; border-radius: 12px;
    backdrop-filter: blur(8px); pointer-events: auto; display:none;
    box-shadow: 0 0 40px #5fd0ff11; }
  #record h3 { margin: 0 0 4px; font-size: 12px; letter-spacing: 2px; color: var(--accent); }
  #record .kind { font-size: 11px; opacity:.6; text-transform: uppercase; letter-spacing:2px; }
  #record .body { margin-top: 10px; white-space: pre-wrap; color:#e8f4ff; }
  #record .close { float:right; cursor:pointer; opacity:.6; }

  /* transmission / replies */
  #stream { bottom: 92px; left: 50%; transform: translateX(-50%);
    width: min(720px, 92vw); text-align: center; }
  .line { margin: 6px auto; padding: 10px 16px; border-radius: 12px;
    background:#0a1322cc; border:1px solid #ffffff14; backdrop-filter: blur(6px);
    white-space: pre-wrap; display:inline-block; max-width: 100%; text-align:left; }
  .line .who { font-size:10px; letter-spacing:2px; opacity:.5; display:block; margin-bottom:3px; }
  .line.warm { color: var(--warm); font-style: italic; border-color:#ffcf6b33; }
  .line.user { color:#fff; border-color:#5fd0ff44; }

  /* console input */
  form { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: min(720px, 92vw); display: flex; gap: 8px; z-index: 11; }
  input { flex:1; padding: 13px 16px; border-radius: 12px;
    border: 1px solid #5fd0ff44; background: #0a1322cc; color:#eaf6ff;
    font: inherit; letter-spacing:1px; backdrop-filter: blur(6px); }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 24px #5fd0ff22; }
  button { padding: 13px 20px; border:0; border-radius:12px; cursor:pointer;
    background: var(--accent); color:#04060d; font: inherit; font-weight:600; letter-spacing:1px; }
  button:disabled { opacity:.5; cursor:default; }
  a.classic { position: fixed; bottom: 24px; right: 22px; z-index: 11;
    color:#5fd0ff88; font-size:11px; text-decoration:none; letter-spacing:1px; }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="hud" id="title"><b>THE ARCHIVE</b><div class="sub">COMPANIONAI</div></div>
  <div class="hud" id="stat">records<span class="pill" id="count">0</span><br><span id="core">core: idle</span></div>

  <div class="hud" id="record">
    <span class="close" onclick="this.parentElement.style.display='none'">✕</span>
    <h3>RECORD</h3>
    <div class="kind" id="rkind"></div>
    <div class="body" id="rbody"></div>
  </div>

  <div class="hud" id="stream"></div>

  <form id="form">
    <input id="input" placeholder="transmit to companion…" autocomplete="off" autofocus />
    <button id="send" type="submit">SEND</button>
  </form>
  <a class="classic" href="/static/classic.html">classic view ›</a>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const KIND_COLORS = {
  fact: 0x5fd0ff, preference: 0x9b8cff, person: 0x6bffb0,
  project: 0xffcf6b, goal: 0xff7b9c, default: 0x88a0c0,
};
const sessionId = localStorage.companionSession ||
  (localStorage.companionSession = 'arc-' + Math.random().toString(36).slice(2, 8));

// ── scene ──────────────────────────────────────────────────────────
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04060d, 0.006);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
camera.position.set(0, 8, 78);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.minDistance = 14;
controls.maxDistance = 260;

scene.add(new THREE.AmbientLight(0x223355, 1.2));
const coreLight = new THREE.PointLight(0x5fd0ff, 3, 400);
scene.add(coreLight);

// starfield
(() => {
  const g = new THREE.BufferGeometry();
  const n = 1800, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 300 + Math.random() * 600;
    const t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r*Math.sin(p)*Math.cos(t); pos[i*3+1] = r*Math.sin(p)*Math.sin(t); pos[i*3+2] = r*Math.cos(p);
  }
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x88aaff, size: 1.1, transparent: true, opacity: .55 })));
})();

// companion core
const core = new THREE.Group();
const coreMat = new THREE.MeshStandardMaterial({ color: 0x0a2540, emissive: 0x5fd0ff, emissiveIntensity: 1.4, roughness: .3, metalness: .6 });
const coreMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(5, 1), coreMat);
const coreWire = new THREE.Mesh(new THREE.IcosahedronGeometry(7.4, 1),
  new THREE.MeshBasicMaterial({ color: 0x5fd0ff, wireframe: true, transparent: true, opacity: .25 }));
core.add(coreMesh, coreWire);
scene.add(core);

// ── memory shards ──────────────────────────────────────────────────
const shardGeo = new THREE.OctahedronGeometry(1.4, 0);
const shards = new THREE.Group();
scene.add(shards);
const linkMat = new THREE.LineBasicMaterial({ color: 0x335577, transparent: true, opacity: .35 });
const links = new THREE.Group();
scene.add(links);
const byPath = new Map();

function fib(i, n, radius) {
  const phi = Math.acos(1 - 2 * (i + 0.5) / n);
  const theta = Math.PI * (1 + Math.sqrt(5)) * i;
  return new THREE.Vector3(
    Math.cos(theta) * Math.sin(phi), Math.cos(phi), Math.sin(theta) * Math.sin(phi)
  ).multiplyScalar(radius);
}

function parseNote(preview) {
  const m = /kind:\s*([a-z]+)/i.exec(preview);
  const kind = m ? m[1].toLowerCase() : 'fact';
  const body = preview.split('---').slice(2).join('---').trim() || preview.trim();
  return { kind, body };
}

function makeLabel(text) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#cfe6ff'; x.font = '600 30px ui-monospace, monospace';
  const t = text.replace(/\s+/g, ' ').slice(0, 38);
  x.fillText(t, 8, 48);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0 }));
  spr.scale.set(16, 4, 1); spr.position.y = 3;
  return spr;
}

function addShard(note, i, n) {
  if (byPath.has(note.path)) return;
  const { kind, body } = parseNote(note.preview);
  const color = KIND_COLORS[kind] || KIND_COLORS.default;
  const radius = 26 + (i % 5) * 7;
  const pos = fib(i, Math.max(n, 12), radius);

  const mesh = new THREE.Mesh(shardGeo, new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: .9, roughness: .35, metalness: .4 }));
  mesh.position.copy(pos);
  mesh.userData = { kind, body, label: makeLabel(body) };
  mesh.add(mesh.userData.label);
  shards.add(mesh);
  byPath.set(note.path, mesh);

  const lg = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), pos]);
  links.add(new THREE.Line(lg, linkMat));
}

async function loadArchive() {
  try {
    const r = await fetch('/memory/list?limit=300');
    const { notes } = await r.json();
    notes.forEach((nt, i) => addShard(nt, i, notes.length));
    document.getElementById('count').textContent = byPath.size;
  } catch (_) {}
}
loadArchive();

// ── interaction ────────────────────────────────────────────────────
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;

addEventListener('pointermove', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});
canvas.addEventListener('click', () => {
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(shards.children, false)[0];
  if (!hit) return;
  const d = hit.object.userData;
  document.getElementById('rkind').textContent = d.kind;
  document.getElementById('rbody').textContent = d.body;
  document.getElementById('record').style.display = 'block';
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setSize(innerWidth, innerHeight);

// ── render loop ────────────────────────────────────────────────────
let thinking = false;
const coreStat = document.getElementById('core');
function animate(t) {
  requestAnimationFrame(animate);
  core.rotation.y = t * 0.0002; core.rotation.x = t * 0.0001;
  const pulse = thinking ? 2.2 + Math.sin(t * 0.012) * 1.4 : 1.4 + Math.sin(t * 0.002) * 0.25;
  coreMat.emissiveIntensity = pulse; coreLight.intensity = pulse;

  // hover highlight + label fade
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(shards.children, false)[0];
  const obj = hit ? hit.object : null;
  if (obj !== hovered) {
    if (hovered) hovered.userData.label.material.opacity = 0;
    hovered = obj;
    canvas.style.cursor = obj ? 'pointer' : 'default';
  }
  if (hovered) hovered.userData.label.material.opacity = 1;
  shards.children.forEach((s) => { s.rotation.y += 0.01; s.rotation.x += 0.004; });

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// ── console / chat ─────────────────────────────────────────────────
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const stream = document.getElementById('stream');

function pushLine(text, cls, who) {
  stream.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  div.innerHTML = `<span class="who">${who}</span>`;
  div.appendChild(document.createTextNode(text));
  stream.appendChild(div);
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  pushLine(text, 'user', 'YOU');
  input.value = ''; send.disabled = true; thinking = true; coreStat.textContent = 'core: thinking';

  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const part of parts) {
        const line = part.replace(/^data: /, '').trim();
        if (!line || line === '[DONE]') continue;
        const ev = JSON.parse(line);
        if (ev.phase === 'warm') {
          pushLine(ev.reply, 'warm', 'LOCAL · keeping warm…');
        } else {
          pushLine(ev.reply, '', (ev.engine === 'cloud' ? 'CLOUD' : 'LOCAL') + ' · ' + (ev.model || ''));
          await loadArchive();  // new memories appear as fresh shards
        }
      }
    }
  } catch (err) {
    pushLine('signal lost: ' + err.message, '', 'ERROR');
  } finally {
    send.disabled = false; thinking = false; coreStat.textContent = 'core: idle'; input.focus();
  }
});
</script>
</body>
</html>
