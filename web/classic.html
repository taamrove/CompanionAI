<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CompanionAI</title>
<style>
  :root { color-scheme: light dark; --accent: #c2703d; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 16px/1.5 system-ui, sans-serif;
    background: #f4f1ea; color: #20201c; display: flex; flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid #0001;
    display: flex; align-items: center; gap: 10px;
  }
  header b { font-size: 18px; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: #2a8; }
  #log { flex: 1; overflow-y: auto; padding: 20px; max-width: 760px;
         margin: 0 auto; width: 100%; }
  .msg { margin: 14px 0; display: flex; gap: 10px; }
  .msg .who { font-size: 12px; opacity: .6; margin-bottom: 2px; }
  .bubble { padding: 10px 14px; border-radius: 14px; max-width: 80%;
            white-space: pre-wrap; }
  .user { justify-content: flex-end; }
  .user .bubble { background: var(--accent); color: #fff; }
  .bot .bubble { background: #fff; border: 1px solid #0001; }
  .bubble.warm { opacity: .7; font-style: italic; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 10px;
         background: #0001; margin-left: 8px; vertical-align: middle; }
  .recalled { font-size: 12px; opacity: .65; margin-top: 6px; }
  form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid #0001;
         max-width: 760px; margin: 0 auto; width: 100%; }
  input { flex: 1; padding: 11px 14px; border-radius: 10px;
          border: 1px solid #0002; font: inherit; background: #fff; }
  button { padding: 11px 18px; border: 0; border-radius: 10px;
           background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header>
    <span class="dot"></span><b>CompanionAI</b>
    <span style="opacity:.5;font-size:13px">local-first companion</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="Say something…" autocomplete="off" autofocus />
    <button id="send" type="submit">Send</button>
  </form>

<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const sessionId = localStorage.companionSession ||
  (localStorage.companionSession = 'web-' + Math.random().toString(36).slice(2, 8));

function add(role, text, cls = '') {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  const col = document.createElement('div');
  if (role !== 'user') {
    const who = document.createElement('div');
    who.className = 'who'; who.textContent = 'companion';
    col.appendChild(who);
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + cls;
  bubble.textContent = text;
  col.appendChild(bubble);
  wrap.appendChild(col);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

function engineTag(bubble, ev) {
  const t = document.createElement('span');
  t.className = 'tag';
  t.textContent = ev.engine + (ev.model ? ' · ' + ev.model : '');
  bubble.appendChild(t);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  add('user', text);
  input.value = ''; send.disabled = true;

  let warmBubble = null;
  try {
    const resp = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.replace(/^data: /, '').trim();
        if (!line || line === '[DONE]') continue;
        const ev = JSON.parse(line);
        if (ev.phase === 'warm') {
          warmBubble = add('bot', ev.reply, 'warm');
          engineTag(warmBubble, ev);
        } else {
          const b = add('bot', ev.reply);
          engineTag(b, ev);
          if (ev.recalled && ev.recalled.length) {
            const r = document.createElement('div');
            r.className = 'recalled';
            r.textContent = '↳ recalled ' + ev.recalled.length + ' memor' +
              (ev.recalled.length === 1 ? 'y' : 'ies');
            b.parentElement.appendChild(r);
          }
        }
      }
    }
  } catch (err) {
    add('bot', 'Error: ' + err.message);
  } finally {
    send.disabled = false; input.focus();
  }
});
</script>
</body>
</html>
